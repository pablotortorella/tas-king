name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:homesuite-app
      - run: npm run test:homesuite-app:integration
      - run: npm run test:homesuite-site
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
